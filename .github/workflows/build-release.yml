# This workflow will do a clean install, start the selenium server, run
# tests, and publish the package files to Npm.

name: PXT Npm Publish

on:
  push:
    tags:
    - '*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1
      with:
        node-version: '14.x'
        registry-url: https://registry.npmjs.org/

    - name: Npm Install
      run: npm ci

    - name: Linux Test Setup
      run: source ./tests/scripts/setup_linux_env.sh

    - name: Build
      run: npm run build:core

    - name: Run
      run: npm run test

    - name: Npm Publish
      run: npm publish

      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
        DISPLAY: :99.0
        CI: true